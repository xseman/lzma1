name: Quality

on:
    pull_request:
        branches:
            - master
        paths:
            - "src/**"
            - "package.json"
            - "tsconfig.json"
            - "tsconfig.tests.json"
            - "fixtures/**"
            - "dprint.json"
            - "bunfig.toml"
            - ".github/.release-config.json"
            - ".github/.release-manifest.json"
            - ".github/workflows/quality.yml"
            - ".github/workflows/release.yml"
    push:
        branches:
            - master
        paths:
            - "src/**"
            - "package.json"
            - "tsconfig.json"
            - "tsconfig.tests.json"
            - "fixtures/**"
            - "dprint.json"
            - "bunfig.toml"
            - ".github/.release-config.json"
            - ".github/.release-manifest.json"
            - ".github/workflows/quality.yml"
            - ".github/workflows/release.yml"
    workflow_dispatch:
        inputs:
            pr_number:
                description: "PR number to run coverage for"
                required: false
                type: string

permissions:
    contents: read
    pull-requests: write
    actions: write

jobs:
    test:
        runs-on: ubuntu-latest
        concurrency:
            group: lzma1-coverage-comment-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: install
              run: bun install

            - name: typecheck
              run: bun run typecheck

            - name: test
              run: bun run test

            - name: Coverage report
              if: (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--')) || github.event_name == 'workflow_dispatch'
              uses: xseman/coverage@v0.4.0
              with:
                  pull-request-number: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
                  update-comment-marker: "<!-- coverage-reporter-lzma1 -->"
                  coverage-artifact-paths: |
                      bun:coverage/lcov.info

    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: install
              run: bun install

            - name: format check
              run: bun run fmt:check

    fixtures:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 21

            - name: install
              run: bun install

            - name: fetch XZ for Java at the pinned commit
              run: |
                  commit="$(node -p 'require("./fixtures/manifest.json").java.commit')"
                  git init --quiet "$RUNNER_TEMP/xz-java"
                  git -C "$RUNNER_TEMP/xz-java" fetch --quiet --depth 1 https://github.com/tukaani-project/xz-java.git "$commit"
                  git -C "$RUNNER_TEMP/xz-java" checkout --quiet FETCH_HEAD

            - name: regenerate
              run: node fixtures/generate.ts "$RUNNER_TEMP/xz-java"

            # javaVersion names the JDK build that ran the generator, not
            # generated content, so it may differ.
            - name: compare with the committed fixtures
              run: |
                  untracked="$(git ls-files --others --exclude-standard -- fixtures)"
                  if ! git diff --exit-code -I '^\s*"javaVersion": ' -- fixtures || [ -n "$untracked" ]; then
                      echo "$untracked"
                      echo "::error::The committed fixtures differ from what fixtures/generate.ts produces; see fixtures/README.md."
                      exit 1
                  fi
